<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosso Encontro ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7eb3,#ff758c);
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    text-align:center;
}

h1{
    color:white;
    margin-bottom:30px;
    font-size:1.8rem;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.grupo{
    text-align:left;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:1rem;
}

input:focus{
    outline:none;
    border-color:#ff758c;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff4f7a;
    color:white;
    font-size:1.1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
}
</style>
</head>
<body>

<div class="container">

    <h1>EU SABIA QUE VOCÊ IA ESCOLHER SIM ❤️</h1>

    <div class="card">

        <div class="grupo">
            <label>Escolha a data:</label>
            <input type="date" id="data">
        </div>

        <div class="grupo">
            <label>Escolha o horário:</label>
            <input type="time" id="hora">
        </div>

        <button id="confirmar">CONFIRMAR ❤️</button>

    </div>

</div>

<script>
document.getElementById("confirmar").addEventListener("click", () => {

    const data = document.getElementById("data").value;
    const hora = document.getElementById("hora").value;

    if(!data || !hora){
        alert("Selecione uma data e um horário!");
        return;
    }

    localStorage.setItem("dataEncontro", data);
    localStorage.setItem("horaEncontro", hora);

    window.location.href = "local.html";

});
</script>

</body>
</html>
