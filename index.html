<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Especial ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff7eb3,#ff758c);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    width:100%;
    padding:20px;
}

h1{
    color:white;
    margin-bottom:40px;
    font-size:2rem;
}

.botoes{
    position:relative;
    height:200px;
}

button{
    border:none;
    padding:15px 35px;
    border-radius:12px;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
}

#sim{
    background:#4CAF50;
    color:white;
    margin-right:15px;
}

#nao{
    background:#f44336;
    color:white;
    position:absolute;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">
    <h1 id="texto">VOCÊ ACEITA SAIR COMIGO?</h1>

    <div class="botoes">
        <button id="sim" >SIM ❤️</button>
        <button id="nao">NÃO 😅</button>
    </div>
</div>

<script>
    document.getElementById("sim").addEventListener("click", () => {
    window.location.href = "agendamento.html";
});
const nao = document.getElementById("nao");
const texto = document.getElementById("texto");

let tentativas = 0;

function moverBotao() {
    const largura = window.innerWidth - 120;
    const altura = window.innerHeight - 100;

    const x = Math.random() * largura;
    const y = Math.random() * altura;

    nao.style.left = `${x}px`;
    nao.style.top = `${y}px`;
}

nao.addEventListener("click", () => {
    tentativas++;

    if(tentativas === 1){
        texto.innerText = "VOCÊ TEM CERTEZA?";
        moverBotao();
    }
    else if(tentativas === 2){
        texto.innerText = "OPÇÃO INVÁLIDA";
        moverBotao();
    }
    else{
        nao.style.display = "none";
    }
});
</script>

</body>
</html>
